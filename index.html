<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>BT Calc v1.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #181818; 
            color: #fff; 
            font-weight: 600;
            margin: 0;
            padding: 0; 
            height: 100vh; 
            width: 100vw;
            overflow: hidden;
        }
        .wrap { 
            max-width: 560px; 
            margin: 0 auto; 
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
            padding-top: calc(50px + env(safe-area-inset-top)); 
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }

        /* Navigation */
        .nav-header { position: fixed; top: 10px; right: 15px; z-index: 1000; }
        .nav-btn { 
            background: rgba(116, 192, 252, 0.15); 
            color: #74c0fc; 
            border: 1px solid rgba(116, 192, 252, 0.4); 
            padding: 8px 16px;
            border-radius: 6px; 
            font-size: 0.85em;
            cursor: pointer; 
        }

        /* View Management */
        .view { display: none; width: 100%; }
        .view.active { display: block; }

        /* Typography */
        h2 { text-align: center; color: #74c0fc; margin-bottom: 12px; font-size: 1.4em; }
        h3 { margin-top: 15px; font-size: 0.9em; color: #aaa; }

        /* Form Elements */
        .row { display: flex; gap: 8px; margin-bottom: 10px; }
        .col { flex: 1; }
        label { display: block; font-size: 0.7em; color: #aaa; margin-bottom: 3px; }
        input[type="number"], input[type="text"] { 
            width: 100%; padding: 12px; border-radius: 6px; 
            border: 1px solid #444; background: #2a2a2a; 
            color: #fff; font-size: 16px; -webkit-appearance: none; 
        }
        input::placeholder { color: #555; }

        /* Buttons */
        .btn { 
            padding: 14px; border-radius: 6px; border: none; 
            font-weight: 700; cursor: pointer; color: #fff; 
            width: 100%; margin-top: 8px; font-size: 1em;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.98); opacity: 0.85; }
        .btn-copy { background: #5a5a5a; margin-bottom: 10px; }
        .btn-calc { background: #1c7ed6; }
        .btn-graph { background: #40c057; margin-top: 6px; }
        .btn-compare { background: #fab005; color: #000; }

        /* Result Displays */
        .result-box { background: #0c2d48; padding: 16px; border-radius: 6px; text-align: center; font-size: 1.2em; margin-top: 14px; color: #a5d6ff; min-height: 60px; }

        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #40c057; color: #fff; padding: 12px 24px; border-radius: 6px; font-weight: 700; display: none; z-index: 2000; }

        /* B-CALC Specific */
        .traj-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.75em; }
        .traj-table th { background: #2a2a2a; color: #aaa; padding: 8px; text-align: left; }
        .traj-table td { padding: 8px; border-bottom: 1px solid #333; }
        .traj-table tr.highlight td { background: #0b3d66; color: #a5d6ff; }

        /* T-CALC Specific */
        .viz-container { margin-top: 20px; background: #2a2a2a; padding: 20px; border-radius: 12px; display: flex; justify-content: center; align-items: center; height: 220px; position: relative; overflow: hidden; }
        .tire-layer { border-radius: 50%; display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; position: absolute; }
        .tire-primary { border: 12px solid #333; z-index: 2; }
        .tire-secondary { border: 8px dashed #74c0fc; opacity: 0.6; z-index: 1; }
        .tire-rim { width: 40%; height: 40%; background: #666; border-radius: 50%; border: 4px solid #888; }
        .tire-label { position: absolute; bottom: 10px; font-size: 0.7em; color: #aaa; width: 100%; text-align: center; }
        .comp-section { margin-top: 20px; }
        .comp-table { width: 100%; border-collapse: collapse; font-size: 0.75em; margin-top: 10px; }
        .comp-table th { background: #2a2a2a; color: #aaa; padding: 8px; text-align: left; }
        .comp-table td { padding: 8px; border-bottom: 1px solid #333; }
        .comp-table tr.active td { background: #0b3d66; color: #a5d6ff; }
    </style>
</head>
<body>

<div class="nav-header">
    <button id="nav-toggle" class="nav-btn">T-CALC</button>
</div>

<div class="wrap">
    <!-- B-CALC VIEW -->
    <div id="view-bcalc" class="view active">
        <h2>B-CALC v1.0</h2>
        <button class="btn btn-copy" id="b-btn-copy">Copy Result</button>
        <div class="row"><div class="col"><label>Weight (gr)</label><input type="number" id="b-i-wt" value="35" inputmode="decimal"></div></div>
        <div class="row"><div class="col"><label>Velocity (fps)</label><input type="number" id="b-i-vel" value="4000" inputmode="decimal"></div></div>
        <div class="row"><label>BC (G1)</label><input type="number" id="b-i-bc" value="0.5" inputmode="decimal"></div>
        <h3>Atmosphere</h3>
        <div class="row">
            <div class="col"><label>Temp (°F)</label><input type="number" id="b-i-temp" value="70" inputmode="decimal"></div>
            <div class="col"><label>Alt (ft)</label><input type="number" id="b-i-alt" value="4600" inputmode="decimal"></div>
        </div>
        <div class="row">
            <div class="col"><label>Press (inHg)</label><input type="number" id="b-i-press" value="29.89" inputmode="decimal"></div>
            <div class="col"><label>Hum (%)</label><input type="number" id="b-i-hum" value="25" inputmode="decimal"></div>
        </div>
        <button class="btn btn-calc" id="b-btn-calc">Calculate FPE</button>
        <div class="row" style="margin-top:15px;"><div class="col"><label>Range (yards)</label><input type="number" id="b-i-range" value="500" inputmode="decimal"></div></div>
        <button class="btn btn-graph" id="b-btn-go">Show Trajectory</button>
        <div class="result-box" id="b-d-res">Energy: 0.00 ft-lbs</div>
        <div id="b-traj-container"></div>
    </div>

    <!-- T-CALC VIEW -->
    <div id="view-tcalc" class="view">
        <h2>T-CALC v1.0</h2>
        <button class="btn btn-copy" id="t-btn-copy">Copy Data</button>
    <div class="row"><div class="col"><label>Overall Diameter (in)</label><input type="number" id="t-i-width" placeholder="e.g. 35 or 245mm" inputmode="decimal"></div></div>
    <div class="row"><div class="col"><label>Tire Width (in) / Aspect (%)</label><input type="number" id="t-i-aspect" placeholder="e.g. 12.5 or 40" inputmode="decimal"></div></div>
    <div class="row"><div class="col"><label>Rim Diameter (in)</label><input type="number" id="t-i-rim" placeholder="e.g. 17" inputmode="decimal"></div></div>

    <h3 style="margin-top:15px;">Comparison Tire</h3>
    <div class="row"><div class="col"><label>Overall Diameter (in)</label><input type="number" id="t-i-width2" placeholder="e.g. 37 or 245mm" inputmode="decimal"></div></div>
    <div class="row"><div class="col"><label>Tire Width (in) / Aspect (%)</label><input type="number" id="t-i-aspect2" placeholder="e.g. 12.5 or 40" inputmode="decimal"></div></div>
    <div class="row"><div class="col"><label>Rim Diameter (in)</label><input type="number" id="t-i-rim2" placeholder="e.g. 17" inputmode="decimal"></div></div>
        <button class="btn btn-calc" id="t-btn-calc">Calculate</button>
        <button class="btn btn-compare" id="t-btn-compare">Compare Two Tires</button>
        <div class="result-box" id="t-d-res">Enter dimensions</div>
        <div class="result-box" id="t-d-stats" style="font-size: 0.8em; min-height: 40px; background: transparent; color: #aaa;"></div>
    <div class="viz-container">
        <div id="t-tire-primary" class="tire-layer tire-primary"><div class="tire-rim"></div></div>
        <div id="t-tire-secondary" class="tire-layer tire-secondary"><div class="tire-rim"></div></div>
        <div class="tire-label" id="t-viz-label">Tire Comparison</div>
    </div>
        <div class="comp-section">
            <h3>Live Comparison</h3>
            <table class="comp-table" id="t-comp-table">
                <thead><tr><th style="width:40%">Tire</th><th style="width:20%">Dia</th><th style="width:20%">Circ.</th><th style="width:20%">Rev/Mi</th></tr></thead>
                <tbody id="t-r-comp"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="toast" id="toast">Copied!</div>

<script>
// --- SHARED UTILS ---
function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(function() { t.style.display = 'none'; }, 2000);
}
function gv(id) { var el = document.getElementById(id); return (el && el.value !== '') ? parseFloat(el.value) : NaN; }
function gs(id) { var el = document.getElementById(id); return (el && el.value !== '') ? el.value : ''; }

// --- NAVIGATION LOGIC ---
var currentView = 'bcalc';
var navBtn = document.getElementById('nav-toggle');

function toggleView(e) {
    if (e) e.preventDefault(); // Prevent any default behavior
    
    if (currentView === 'bcalc') {
        document.getElementById('view-bcalc').classList.remove('active');
        document.getElementById('view-tcalc').classList.add('active');
        navBtn.textContent = 'B-CALC';
        currentView = 'tcalc';
    } else {
        document.getElementById('view-tcalc').classList.remove('active');
        document.getElementById('view-bcalc').classList.add('active');
        navBtn.textContent = 'T-CALC';
        currentView = 'bcalc';
    }
}

// Use both click and touchstart for maximum mobile compatibility
navBtn.addEventListener('click', toggleView);
navBtn.addEventListener('touchstart', toggleView, {passive: false});

// --- B-CALC LOGIC (Namespaced) ---
function bCalc_calc() {
    var wt = gv('b-i-wt');
    var vel = gv('b-i-vel');
    if (isNaN(wt) || isNaN(vel)) {
        document.getElementById('b-d-res').innerHTML = 'Enter weight & velocity';
        return null;
    }
    var T = gv('b-i-temp');
    var P = gv('b-i-press');
    var A = gv('b-i-alt');
    var H = gv('b-i-hum');
    var effP = P;
    if (!isNaN(A) && (isNaN(P) || P === 0)) {
        effP = 29.92 * Math.pow(1 - (0.0000068755 * A), 5.255);
    }
    var ratio = 1.0;
    if (!isNaN(T) && !isNaN(P)) {
        var Tk = (T + 459.67) * 5 / 9;
        var Pk = effP * 3.38639;
        var sTk = (59 + 459.67) * 5 / 9;
        var sPk = 29.92 * 3.38639;
        var cr = Pk / (287.05 * Tk);
        var sr = sPk / (287.05 * sTk);
        ratio = cr / sr;
        if (!isNaN(H)) { ratio *= (1 - (H / 100 * 0.003)); }
    }
    var cVel = vel * Math.sqrt(1 / ratio);
    var fpe = (wt * cVel * cVel) / 450436;
    document.getElementById('b-d-res').innerHTML = '<b style="font-size:1.5em;">' + fpe.toFixed(2) + ' ft-lbs</b><br><span style="font-size:0.6em; color:#aaa;">Adj Vel: ' + cVel.toFixed(0) + ' fps</span>';
    return { wt: wt, vel: cVel };
}

document.getElementById('b-btn-calc').onclick = bCalc_calc;
document.getElementById('b-btn-copy').onclick = function() {
    var wt = gv('b-i-wt'); var vel = gv('b-i-vel');
    if (isNaN(wt) || isNaN(vel)) return;
    var res = bCalc_calc(); if (!res) return;
    var fpe = (wt * res.vel * res.vel) / 450436;
    var bc = parseFloat(gs('b-i-bc')) || 0.2;
    var text = 'B-CALC\nWeight: ' + wt.toFixed(2) + 'gr\nVel: ' + vel.toFixed(0) + 'fps (Adj: ' + res.vel.toFixed(0) + ')\nBC: ' + bc + '\nFPE: ' + fpe.toFixed(2);
    navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
};
document.getElementById('b-btn-go').onclick = function() {
    var data = bCalc_calc(); if (!data) return;
    var maxYards = parseInt(gs('b-i-range')) || 500;
    var g = 32.17 * 12; var container = document.getElementById('b-traj-container');
    var step = maxYards < 50 ? Math.max(1, Math.floor(maxYards / 5)) : 10;
    var html = '<table class="traj-table"><thead><tr><th style="width:40%">Dist</th><th style="width:30%">FPE</th><th style="width:30%">Drop</th></tr></thead><tbody>';
    for (var y = 0; y <= maxYards; y += step) {
        var distFt = y * 3; var t = distFt / data.vel;
        var dropInches = 0.5 * g * t * t;
        var bc = parseFloat(gs('b-i-bc')) || 0.2;
        var dragFactor = 0.0001 / bc;
        var velAtY = data.vel * Math.exp(-dragFactor * distFt);
        var fpeAtY = (data.wt * velAtY * velAtY) / 450436;
        html += '<tr><td>' + y + 'y</td><td>' + fpeAtY.toFixed(1) + '</td><td>' + dropInches.toFixed(2) + '"</td></tr>';
    }
    html += '</tbody></table>'; container.innerHTML = html;
};

// --- T-CALC LOGIC (Namespaced) ---
function tCalc_calc(prefix) {
    var w = gv('t-i-width' + prefix);  // For metric: width in mm. For truck: overall diameter (inches)
    var a = gv('t-i-aspect' + prefix);  // For metric: aspect ratio (%). For truck: tire width (inches)
    var r = gv('t-i-rim' + prefix);     // Rim diameter in inches

    if (isNaN(w) || isNaN(a) || isNaN(r)) return null;

    var isMetric = (w > 100);
    var totalDia, circumference, revsPerMile;
    var labelStr;

    if (isMetric) {
        // Metric tire: 245/40-17 format (width in mm, aspect %)
        var widthInches = w / 25.4;            // Convert mm to inches
        var sidewallHeight = widthInches * (a / 100);  // Aspect ratio: sidewall = width * (aspect%)
        totalDia = (sidewallHeight * 2) + r;   // Sidewall * 2 + rim
        labelStr = w + '/' + a + 'R' + r;      // Standard metric format: 245/40-17
    } else {
        // Truck tire: 35x12.5-17 format (overall diameter, tire width, rim)
        totalDia = w;                          // Use directly — first number IS the diameter
        circumference = Math.PI * totalDia;
        revsPerMile = 63360 / circumference;
        labelStr = w + 'x' + a + '-' + r;      // Standard truck format: 35x12.5-17
    }

    circumference = Math.PI * totalDia;
    revsPerMile = 63360 / circumference;

    // Display primary tire results
    if (prefix === '') {
        document.getElementById('t-d-res').innerHTML = 
            '<b style="font-size:1.5em;">' + totalDia.toFixed(2) + '" Dia</b>';
        document.getElementById('t-d-stats').innerHTML = 
            'Circ: ' + circumference.toFixed(2) + '" | Rev/Mi: ' + Math.round(revsPerMile);
    }

    return { 
        label: labelStr, 
        dia: totalDia, 
        circ: circumference,
        unitLabel: '"',  // All truck tires are in inches
        revs: revsPerMile, 
        width: w,
        isMetric: isMetric
    };
}

function updateViz(pDia, sDia, pWidth, sWidth) {
    var pViz = document.getElementById('t-tire-primary');
    var sViz = document.getElementById('t-tire-secondary');
    var label = document.getElementById('t-viz-label');
    if (!pViz || !sViz || !label) return;

    var maxDia = Math.max(pDia, sDia);
    var scale = 140 / maxDia; 

    pViz.style.width = (pDia * scale) + 'px';
    pViz.style.height = (pDia * scale) + 'px';
    sViz.style.width = (sDia * scale) + 'px';
    sViz.style.height = (sDia * scale) + 'px';

    label.textContent = pWidth + ' vs ' + sWidth;
}

document.getElementById('t-btn-calc').onclick = function() {
    var t1 = tCalc_calc(''); 
    var t2 = tCalc_calc('2');
    
    // Update visualizer with both tires if available
    if (t1 && t2) {
        updateViz(t1.dia, t2.dia, t1.width, t2.width);
    } else if (t1) {
        updateViz(t1.dia, 0, t1.width, '0');
    }

    // Update comparison table with standard labels
    var body = document.getElementById('t-r-comp'); body.innerHTML = '';
    [t1, t2].filter(x => x !== null).forEach(item => {
        var row = document.createElement('tr');
        row.innerHTML = '<td>' + item.label + '</td><td>' + item.dia.toFixed(2) + '"</td><td>' + item.circ.toFixed(1) + '"</td><td>' + Math.round(item.revs) + '</td>';
        body.appendChild(row);
    });
};

document.getElementById('t-btn-compare').onclick = function() {
    var t1 = tCalc_calc(''); 
    var t2 = tCalc_calc('2');

    // Update visualizer on compare too
    if (t1 && t2) {
        updateViz(t1.dia, t2.dia, t1.width, t2.width);
    }

    if (!t1 || !t2) return;
    
    // Use metric tire as reference for comparison
    var ref = t1.isMetric ? t1 : t2;  // If one is metric, use it as reference
    var other = ref.isMetric ? t2 : t1;  // The non-metric one
    
    var diffDia = other.dia - ref.dia; 
    var unitLabel = '"';
    var diffPerc = (diffDia / ref.dia) * 100;
    var diffRev = other.revs - ref.revs;

    document.getElementById('t-d-res').innerHTML = '<b style="font-size:1.2em;">Difference</b>';
    document.getElementById('t-d-stats').innerHTML = 
        'Dia: ' + (diffDia > 0 ? '+' : '') + diffDia.toFixed(2) + '" (' + (diffPerc > 0 ? '+' : '') + diffPerc.toFixed(1) + '%)\n' +
        'Rev/Mi: ' + (diffRev > 0 ? '+' : '') + Math.round(diffRev);
};

document.getElementById('t-btn-copy').onclick = function() {
    var res1 = tCalc_calc(''); 
    if (!res1) return;

    var text = 'TIRE DATA\n';
    text += '--- Primary ---\nSize: ' + res1.label + '\nDia: ' + res1.dia.toFixed(2) + '"\nCirc: ' + res1.circ.toFixed(2) + '"\nRev/Mi: ' + Math.round(res1.revs);

    var res2 = tCalc_calc('2');
    if (res2) {
        text += '\n\n--- Comparison ---\nSize: ' + res2.label + '\nDia: ' + res2.dia.toFixed(2) + '"\nCirc: ' + res2.circ.toFixed(2) + '"\nRev/Mi: ' + Math.round(res2.revs);

        // Use metric tire as reference for comparison
        var ref = res1.isMetric ? res1 : res2;
        var other = ref.isMetric ? res2 : res1;
        
        var diffDia = other.dia - ref.dia;
        var unitLabel = '"';
        var diffPerc = (diffDia / ref.dia) * 100;
        var diffRev = other.revs - ref.revs;
        text += '\n\n--- Difference ---\nDia: ' + (diffDia > 0 ? '+' : '') + diffDia.toFixed(2) + '" (' + (diffPerc > 0 ? '+' : '') + diffPerc.toFixed(1) + '%)\nRev/Mi: ' + (diffRev > 0 ? '+' : '') + Math.round(diffRev);
    }

    navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
};
}

function updateViz(pDia, sDia, pWidth, sWidth) {
    var pViz = document.getElementById('t-tire-primary');
    var sViz = document.getElementById('t-tire-secondary');
    var label = document.getElementById('t-viz-label');
    if (!pViz || !sViz || !label) return;

    var maxDia = Math.max(pDia, sDia);
    var scale = 140 / maxDia; 

    pViz.style.width = (pDia * scale) + 'px';
    pViz.style.height = (pDia * scale) + 'px';
    sViz.style.width = (sDia * scale) + 'px';
    sViz.style.height = (sDia * scale) + 'px';

    label.textContent = pWidth + ' vs ' + sWidth;
}

document.getElementById('t-btn-calc').onclick = function() {
    var t1 = tCalc_calc(''); 
    var t2 = tCalc_calc('2');
    
    // Update visualizer with both tires if available
    if (t1 && t2) {
        updateViz(t1.dia, t2.dia, t1.width, t2.width);
    } else if (t1) {
        updateViz(t1.dia, 0, t1.width, '0');
    }

    // Update comparison table with consistent units
    var body = document.getElementById('t-r-comp'); body.innerHTML = '';
    [t1, t2].filter(x => x !== null).forEach(item => {
        var row = document.createElement('tr');
        row.innerHTML = '<td>' + item.label + '</td><td>' + item.dia.toFixed(2) + ' ' + item.unitLabel + '</td><td>' + item.circ.toFixed(1) + ' ' + item.unitLabel + '</td><td>' + Math.round(item.revs) + '</td>';
        body.appendChild(row);
    });
};

document.getElementById('t-btn-compare').onclick = function() {
    var t1 = tCalc_calc(''); 
    var t2 = tCalc_calc('2');

    // Update visualizer on compare too
    if (t1 && t2) {
        updateViz(t1.dia, t2.dia, t1.width, t2.width);
    }

    if (!t1 || !t2) return;
    var diffDia = t2.dia - t1.dia; 
    var unitLabel = (t1.unitLabel === 'mm') ? 'mm' : '"';
    var diffPerc = (diffDia / t1.dia) * 100;
    var diffRev = t2.revs - t1.revs;

    document.getElementById('t-d-res').innerHTML = '<b style="font-size:1.2em;">Difference</b>';
    document.getElementById('t-d-stats').innerHTML = 
        'Dia: ' + (diffDia > 0 ? '+' : '') + diffDia.toFixed(2) + ' ' + unitLabel + 
        ' (' + (diffPerc > 0 ? '+' : '') + diffPerc.toFixed(1) + '%)\n' +
        'Rev/Mi: ' + (diffRev > 0 ? '+' : '') + Math.round(diffRev);
};

document.getElementById('t-btn-copy').onclick = function() {
    var res1 = tCalc_calc(''); 
    if (!res1) return;

    var text = 'TIRE DATA\n';
    text += '--- Primary ---\nSize: ' + res1.label + '\nDia: ' + res1.dia.toFixed(2) + ' ' + res1.unitLabel + '\nCirc: ' + res1.circ.toFixed(2) + ' ' + res1.unitLabel + '\nRev/Mi: ' + Math.round(res1.revs);

    var res2 = tCalc_calc('2');
    if (res2) {
        text += '\n\n--- Comparison ---\nSize: ' + res2.label + '\nDia: ' + res2.dia.toFixed(2) + ' ' + res2.unitLabel + '\nCirc: ' + res2.circ.toFixed(2) + ' ' + res2.unitLabel + '\nRev/Mi: ' + Math.round(res2.revs);

        var diffDia = res2.dia - res1.dia;
        var unitLabel = (res1.unitLabel === 'mm') ? 'mm' : '"';
        var diffPerc = (diffDia / res1.dia) * 100;
        var diffRev = res2.revs - res1.revs;
        text += '\n\n--- Difference ---\nDia: ' + (diffDia > 0 ? '+' : '') + diffDia.toFixed(2) + ' ' + unitLabel + 
                ' (' + (diffPerc > 0 ? '+' : '') + diffPerc.toFixed(1) + '%)\nRev/Mi: ' + (diffRev > 0 ? '+' : '') + Math.round(diffRev);
    }

    navigator.clipboard.writeText(text).then(() => showToast('Copied!'));
};

// Pre-populate B-CALC and T-CALC
window.onload = function() {
    // Pre-populate B-CALC defaults (35gr, 4000fps, BC .5)
    document.getElementById('b-i-wt').value = 35;
    document.getElementById('b-i-vel').value = 4000;
    document.getElementById('b-i-bc').value = '0.5';

    // Pre-populate T-CALC defaults (35x12.5-17 and 37x12.5-17)
    document.getElementById('t-i-width').value = 35;
    document.getElementById('t-i-aspect').value = 12.5;
    document.getElementById('t-i-rim').value = 17;

    // Pre-populate T-CALC comparison (37x12.5-17)
    document.getElementById('t-i-width2').value = 37;
    document.getElementById('t-i-aspect2').value = 12.5;
    document.getElementById('t-i-rim2').value = 17;

    // Trigger initial T-CALC calculation to show visualizer
    document.getElementById('t-btn-calc').click();
};
